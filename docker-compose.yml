version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "cub zk-ready localhost:2181 10 2>/dev/null && echo healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://100.71.186.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server kafka:29092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: "/bin/bash"
    command:
      - "-c"
      - |
        sleep 20
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic raw-alerts --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic normalized-events --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic enriched-events --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic incidents --partitions 1 --replication-factor 1
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --topic failed-events --partitions 1 --replication-factor 1
        echo "All topics:"
        kafka-topics --list --bootstrap-server kafka:29092
    restart: "no"

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

  normalizer:
    build:
      context: ./services/normalizer
      dockerfile: Dockerfile
    container_name: normalizer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./shared:/app/shared
      - ./services/normalizer:/app
    restart: unless-stopped

  enricher:
    build:
      context: ./services/enricher
      dockerfile: Dockerfile
    container_name: enricher
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./shared:/app/shared
      - ./services/enricher:/app
      - ./services/enricher/mitre_map.json:/app/mitre_map.json
      - ./services/enricher/assets.json:/app/assets.json
    restart: unless-stopped

  dlq-handler:
    build:
      context: ./services/dlq_handler
      dockerfile: Dockerfile
    container_name: dlq-handler
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./shared:/app/shared
      - ./services/dlq_handler:/app
    restart: unless-stopped

  detection-engine:
    build:
      context: ./services/detection-engine
      dockerfile: dockerfile
    container_name: detection-engine
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./shared:/app/shared
      - ./services/detection-engine:/app
    restart: unless-stopped

  watchdog:
   build:
    context: .
    dockerfile: ./services/watchdog/Dockerfile
   container_name: watchdog
   depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
   env_file:
    - .env
   volumes:
    - ./shared:/app/shared
    - /var/run/docker.sock:/var/run/docker.sock
    - ./secrets/watchdog_id_ed25519:/app/ssh/watchdog_id_ed25519:ro
   restart: unless-stopped
   environment:
      - SSH_KEY_PATH=/app/ssh/watchdog_id_ed25519

  verification:
    build: ./services/verification
    env_file: .env
    depends_on:
      - redis
      - postgres

  dashboard_api:
   build: ./services/dashboard_api
   env_file: .env
   ports:
    - "8001:8001"
   volumes:
    - ./shared:/app/shared
   depends_on:
    - redis
    - postgres

  pipeline-monitor:
    build: ./services/pipeline-monitor
    container_name: pipeline-monitor
    restart: unless-stopped
    depends_on: [kafka]
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka:29092
      - TOPIC_GROUP_PAIRS=raw-alerts:normalizer-group,normalized-events:enricher-group,enriched-events:detection-engine-group,failed-events:dlq-handler-group
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - LAG_THRESHOLD=100

  evaluation:
    build: ./tools/evaluation
    profiles: ["tools"]
    environment:
      - ORCHESTRATOR_HOST=100.82.97.75
      - ORCHESTRATOR_SSH_USER=h pp
      - ORCHESTRATOR_CONTAINER=protego-orchestrator
      - SSH_KEY_PATH=/app/ssh/watchdog_id_ed25519
      - AGENTS_HOST=100.103.120.48
      - AGENTS_SSH_USER=HP
      - POSTGRES_DSN=dbname=soar_db user=soar_user password=soar_password123 host=postgres port=5432
    volumes:
      - ./secrets/watchdog_id_ed25519:/app/ssh/watchdog_id_ed25519:ro
      - ./tools/evaluation/results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - postgres

  baseline-dispatcher:
    build: ./tools/baseline-dispatcher
    profiles: ["tools"]
    depends_on: [redis, postgres]

  es-init:
    image: curlimages/curl:latest
    profiles: ["tools"]
    volumes:
      - ./tools/elasticsearch/ilm-policies.sh:/ilm-policies.sh
    entrypoint: ["/bin/sh", "/ilm-policies.sh"]
    environment:
      - ES_URL=${ELASTICSEARCH_URL}

volumes:
  redis-data:
  postgres-data: